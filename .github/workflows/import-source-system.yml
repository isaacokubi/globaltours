name: Import Global Tours system from source repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout source Global Tours system
        uses: actions/checkout@v4
        with:
          repository: isaacokubi/hussein-mboya-tours
          ref: main
          path: source
          fetch-depth: 1

      - name: Replace target repository with source system
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' source/ target/
          rm -f target/.github/workflows/flutter.yml
          rm -f target/.github/workflows/import-source-system.yml
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "chore: migrate complete Global Tours system"
          git push origin HEAD:main
